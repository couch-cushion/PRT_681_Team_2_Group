services:
  api:
    build:
      context: .
    ports:
      - "5001:5000"
    volumes:
      - ./tasks.db:/app/tasks.db

  frontend:
    image: nginx:alpine
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
